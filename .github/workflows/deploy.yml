name: Deploy

on:
  push:
    branches:
      - main

jobs:
  backend-deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install sshpass
      run: sudo apt-get update && sudo apt-get install -y sshpass rsync

    - name: Sync files via rsync
      env:
        SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      run: |
        sshpass -e rsync -avzr --delete \
          --exclude="__pycache__" \
          --exclude=".git" \
          --exclude=".github" \
          --exclude=".env" \
          --exclude=".gitignore" \
          --exclude="storage" \
          --exclude=".venv" \
          --exclude="secret.yaml" \
          --exclude="*.keras" \
          --exclude="CSV" \
          --exclude="images" \
          -e "ssh -o StrictHostKeyChecking=no" \
          ./ ubuntu@27.133.132.208:${{ secrets.REMOTE_PATH }}
